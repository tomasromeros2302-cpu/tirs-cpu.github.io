<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f4f5"><title>TIRS — Objetos en perspectiva</title><meta name="description" content="Presentación interactiva de mobiliario y objetos de diseño.">  <script type="module" crossorigin src="./assets/index-CDTZmRnu.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BehqxprP.css">
</head><body>
<div id="app"><header class="topbar"><a class="brand" href="./" aria-label="TIRS inicio">TIRS<span>OBJETOS EN PERSPECTIVA</span></a><button id="uploadTop" class="button">＋ Cargar modelo</button></header>
<main class="viewport" id="dropZone" aria-label="Presentación interactiva 3D"><div id="canvasHost"></div>
<div class="product"><span class="eyebrow">DISEÑO / EXPLORACIÓN 3D</span><h1 id="modelName">Modelo de producto</h1><p id="modelSubtitle">Cargando modelo…</p></div>
<div class="view-tabs" aria-label="Vistas del producto"><button data-view="perspective" class="active">Perspectiva</button><button data-view="front">Frontal</button><button data-view="side">Lateral</button><button data-view="top">Superior</button></div>
<div class="tools"><button id="zoomIn" title="Acercar" aria-label="Acercar">＋</button><button id="zoomOut" title="Alejar" aria-label="Alejar">−</button><span></span><button id="resetButton" title="Restablecer vista" aria-label="Restablecer vista">↺</button><button id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶</button></div>
<div class="bottom"><div class="hint">Arrastra para girar <span>·</span> Rueda para zoom <span>·</span> Clic derecho para mover</div><div class="explosion"><div class="explosion-heading"><label for="explodeRange">Explorar el ensamblaje</label><output id="explodeValue">0%</output></div><div class="slider-row"><span>Armado</span><input type="range" id="explodeRange" min="0" max="100" value="0" aria-label="Separación de las piezas"><span>Separado</span></div></div><span class="footnote">Una nueva perspectiva de cada detalle.</span></div>
<div id="dropOverlay" class="drop-overlay"><strong>Suelta tu modelo aquí</strong><span>Archivo .glb</span></div><div id="toast" class="toast" role="status" aria-live="polite"></div></main><input id="fileInput" type="file" accept=".glb,model/gltf-binary" hidden></div></body></html>
